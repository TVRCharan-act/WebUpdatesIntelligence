# Local API/UI smoke-test stack. Production uses ECS/Fargate and EventBridge;
# this file intentionally has no database, Redis, Celery, or scheduler service.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-sentinel-actalyst}
      ECS_CLUSTER: ${ECS_CLUSTER:-}
      ECS_TASK_DEFINITION: ${ECS_TASK_DEFINITION:-}
      ECS_CONTAINER_NAME: ${ECS_CONTAINER_NAME:-worker}
      ECS_NETWORK_CONFIGURATION: ${ECS_NETWORK_CONFIGURATION:-{}}
      # The local compose stack has no worker service, so execute jobs in the
      # backend process unless an explicit backend is supplied.
      TASK_EXECUTION_BACKEND: ${TASK_EXECUTION_BACKEND:-local}
      ZENROWS_API_KEY: ${ZENROWS_API_KEY:-}
      CRAWL4AI_TIMEOUT_SECONDS: ${CRAWL4AI_TIMEOUT_SECONDS:-20}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_GEMINI_MODEL: ${GOOGLE_GEMINI_MODEL:-gemini-3.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4}
      # auto = prefer Gemini, fall back to OpenAI per URL; or force gemini/openai.
      ANALYSIS_PROVIDER: ${ANALYSIS_PROVIDER:-auto}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      DEFAULT_PROCESSING_PIPELINE: ${DEFAULT_PROCESSING_PIPELINE:-auto}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-}
      SES_REGION: ${SES_REGION:-}
      SES_DEFAULT_RECIPIENTS: ${SES_DEFAULT_RECIPIENTS:-}
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      USER_1_NAME: ${USER_1_NAME:-}
      USER_1_PASSWORD: ${USER_1_PASSWORD:-}
      USER_2_NAME: ${USER_2_NAME:-}
      USER_2_PASSWORD: ${USER_2_PASSWORD:-}
      USER_3_NAME: ${USER_3_NAME:-}
      USER_3_PASSWORD: ${USER_3_PASSWORD:-}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - backend
