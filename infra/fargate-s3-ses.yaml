AWSTemplateFormatVersion: '2010-09-09'
Description: Minimal Sentinel Actalyst S3 and least-privilege ECS task roles.
Parameters:
  Environment:
    Type: String
    Default: prod
  S3Prefix:
    Type: String
    Default: sentinel-actalyst
  SesIdentityArn:
    Type: String
  WorkerTaskDefinitionArn:
    Type: String
  EcsClusterArn:
    Type: String
  WorkerTaskRoleArn:
    Type: String
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  WorkerSecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  SentinelTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SentinelDataAndEmail
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: !Sub '${S3Prefix}/${Environment}/v1/*'
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${DataBucket.Arn}/${S3Prefix}/${Environment}/v1/*'
              - Effect: Allow
                Action: [ses:SendEmail, ses:SendRawEmail]
                Resource: !Ref SesIdentityArn
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunOnlyWorkerTask
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Ref WorkerTaskDefinitionArn
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Ref WorkerTaskRoleArn
  DueMonitorSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      FlexibleTimeWindow:
        Mode: 'OFF'
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Target:
        Arn: !Ref EcsClusterArn
        RoleArn: !GetAtt SchedulerRole.Arn
        EcsParameters:
          TaskDefinitionArn: !Ref WorkerTaskDefinitionArn
          LaunchType: FARGATE
          NetworkConfiguration:
            AwsvpcConfiguration:
              Subnets: !Ref PrivateSubnetIds
              SecurityGroups: !Ref WorkerSecurityGroupIds
              AssignPublicIp: DISABLED
Outputs:
  BucketName: {Value: !Ref DataBucket}
  TaskRoleArn: {Value: !GetAtt SentinelTaskRole.Arn}
  SchedulerRoleArn: {Value: !GetAtt SchedulerRole.Arn}
